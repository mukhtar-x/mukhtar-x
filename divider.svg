<svg width="100%" height="6" viewBox="0 0 1000 6" xmlns="http://www.w3.org/2000/svg">
  <style>
    .track { stroke: #30363d; }
    .glow { stroke: #2196F3; }
    @media (prefers-color-scheme: light) {
      .track { stroke: #d0d7de; }
    }
  </style>
  <line x1="0" y1="3" x2="1000" y2="3" class="track" stroke-width="1"/>
  <line x1="-120" y1="3" x2="-20" y2="3" class="glow" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" values="-120;1000" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="-20;1100" dur="3.5s" repeatCount="indefinite"/>
  </line>
</svg>
