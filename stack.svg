<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120">
  <defs>
    <style>
      .bg { fill: #000; }
      .text-main { font-family: 'Courier New', monospace; font-size: 24px; fill: #FFF; font-weight: bold; letter-spacing: 4px; }
      .text-sub { font-family: 'Courier New', monospace; font-size: 12px; fill: #555; letter-spacing: 8px; }
      
      @keyframes blinkFast { 0%, 100% { fill: #333; } 50% { fill: #FFF; } }
      @keyframes sweep { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }

      .node-1 { animation: blinkFast 0.5s infinite; }
      .node-2 { animation: blinkFast 0.8s infinite; }
      .node-3 { animation: blinkFast 1.2s infinite; }
      .scan-bar { transform-origin: left; animation: sweep 3s cubic-bezier(0.1, 0.7, 0.1, 1) infinite alternate; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- Hardware/Server Abstract -->
  <rect x="70" y="35" width="60" height="10" fill="none" stroke="#555" stroke-width="1" />
  <rect x="70" y="55" width="60" height="10" fill="none" stroke="#555" stroke-width="1" />
  <rect x="70" y="75" width="60" height="10" fill="none" stroke="#555" stroke-width="1" />
  
  <!-- Blinking Nodes -->
  <rect x="75" y="38" width="4" height="4" class="node-1" />
  <rect x="85" y="38" width="4" height="4" class="node-2" />
  <rect x="75" y="58" width="4" height="4" class="node-3" />
  <rect x="75" y="78" width="4" height="4" class="node-2" />
  <rect x="85" y="78" width="4" height="4" class="node-1" />

  <!-- Sweeping Scan Bar -->
  <rect x="180" y="90" width="300" height="1" fill="#FFF" class="scan-bar" />

  <!-- Typography -->
  <text x="190" y="55" class="text-main">TECH_STACK</text>
  <text x="192" y="80" class="text-sub">CORE_COMPETENCIES :: INIT</text>
</svg>
