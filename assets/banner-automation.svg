<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .bg { fill: #000000; stroke: #333333; stroke-width: 1; }
      .title { font-family: 'Fira Code', -apple-system, monospace; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .sub { font-family: 'Fira Code', -apple-system, monospace; font-size: 11px; fill: #a0a0a0; letter-spacing: 2px; }
      .cursor { animation: blink 1s infinite; fill: #ffffff; }
      .hud { stroke: #ffffff; stroke-width: 1.5; fill: none; opacity: 0.6; }
      .icon { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Expanded background rectangle for 1200px width -->
  <rect class="bg" x="2" y="2" width="1196" height="76" rx="6" />

  <!-- Adjusted right corner HUD brackets for 1200px width -->
  <path class="hud" d="M 12 18 L 12 12 L 18 12 M 1182 12 L 1188 12 L 1188 18 M 12 62 L 12 68 L 18 68 M 1188 62 L 1188 68 L 1182 68" />

  <g transform="translate(32, 28)">
    <path class="icon" d="M22 12h-4l-3 9L9 3l-3 9H2"/>
  </g>

  <text x="70" y="38" class="title">Automation &amp; Workflow Engineering</text>
  <rect x="425" y="22" width="10" height="20" class="cursor" />
  <text x="70" y="58" class="sub">TASK EXECUTION ENGINES · SYSTEM MONITORING · N8N PIPELINES</text>
</svg>
