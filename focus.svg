<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120">
  <defs>
    <style>
      .bg { fill: #000; }
      .text-main { font-family: 'Courier New', monospace; font-size: 24px; fill: #FFF; font-weight: bold; letter-spacing: 4px; }
      .text-sub { font-family: 'Courier New', monospace; font-size: 12px; fill: #555; letter-spacing: 8px; }
      .wave { fill: none; stroke: #FFF; stroke-width: 1.5; opacity: 0.8; }
      .grid { stroke: #111; stroke-width: 1; }
      
      @keyframes dash { 
        0% { stroke-dashoffset: 200; } 
        100% { stroke-dashoffset: 0; } 
      }
      @keyframes scan { 
        0%, 100% { transform: translateY(0); opacity: 0.5; } 
        50% { transform: translateY(15px); opacity: 1; } 
      }

      .line-anim { stroke-dasharray: 200; animation: dash 3s linear infinite; }
      .reticle { transform-origin: 100px 60px; animation: scan 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- Background Grid -->
  <path d="M0 20 H850 M0 40 H850 M0 60 H850 M0 80 H850 M0 100 H850" class="grid" />

  <!-- Animated Targeting Reticle -->
  <g class="reticle">
    <path d="M 80 40 L 90 40 L 90 50" fill="none" stroke="#FFF" stroke-width="2" />
    <path d="M 120 40 L 110 40 L 110 50" fill="none" stroke="#FFF" stroke-width="2" />
    <path d="M 80 80 L 90 80 L 90 70" fill="none" stroke="#FFF" stroke-width="2" />
    <path d="M 120 80 L 110 80 L 110 70" fill="none" stroke="#FFF" stroke-width="2" />
    <circle cx="100" cy="60" r="2" fill="#FFF" />
  </g>

  <!-- Data Waveform Line -->
  <path d="M 180 60 Q 220 20, 260 60 T 340 60 T 420 60" class="wave line-anim" />

  <!-- Typography -->
  <text x="190" y="55" class="text-main">SYSTEM_TRAJECTORY</text>
  <text x="192" y="80" class="text-sub">ZERO_TRUST :: THREAT_INTEL</text>
</svg>
