<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120">
  <defs>
    <style>
      .bg { fill: #000; }
      .text-main { font-family: 'Courier New', monospace; font-size: 24px; fill: #FFF; font-weight: bold; letter-spacing: 4px; }
      .text-sub { font-family: 'Courier New', monospace; font-size: 12px; fill: #555; letter-spacing: 8px; }
      
      @keyframes rise { 
        0% { transform: scaleY(0.2); } 
        100% { transform: scaleY(1); } 
      }
      @keyframes ekg {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: -100; }
      }

      .bar { transform-origin: bottom; animation: rise 1s ease-in-out infinite alternate; }
      .b1 { animation-delay: 0.1s; }
      .b2 { animation-delay: 0.5s; }
      .b3 { animation-delay: 0.3s; }
      .b4 { animation-delay: 0.7s; }
      
      .heartbeat { fill: none; stroke: #FFF; stroke-width: 1.5; stroke-dasharray: 50 100; animation: ekg 2s linear infinite; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- Analytics Bars -->
  <rect x="70" y="70" width="8" height="20" fill="#333" class="bar b1" />
  <rect x="85" y="55" width="8" height="35" fill="#555" class="bar b2" />
  <rect x="100" y="45" width="8" height="45" fill="#FFF" class="bar b3" />
  <rect x="115" y="60" width="8" height="30" fill="#777" class="bar b4" />
  <line x1="60" y1="90" x2="135" y2="90" stroke="#FFF" stroke-width="1" />

  <!-- Heartbeat / Telemetry Line -->
  <path d="M 180 75 L 200 75 L 210 50 L 220 90 L 230 75 L 850 75" class="heartbeat" />

  <!-- Typography -->
  <text x="190" y="45" class="text-main">METRICS_ECOSYSTEM</text>
  <text x="192" y="65" class="text-sub">TELEMETRY_DATA :: LIVE</text>
</svg>
