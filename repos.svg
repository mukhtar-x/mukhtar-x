<svg xmlns="http://www.w3.org/2000/svg" width="850" height="120" viewBox="0 0 850 120">
  <defs>
    <style>
      .bg { fill: #000; }
      .text-main { font-family: 'Courier New', monospace; font-size: 24px; fill: #FFF; font-weight: bold; letter-spacing: 4px; }
      .text-sub { font-family: 'Courier New', monospace; font-size: 12px; fill: #555; letter-spacing: 8px; }
      
      @keyframes floatData { 
        0% { transform: translate(0, 0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(60px, 0); opacity: 0; }
      }
      @keyframes unlock {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }

      .data-packet-1 { animation: floatData 2s linear infinite; }
      .data-packet-2 { animation: floatData 2.5s linear infinite 1s; }
      .lock-shackle { animation: unlock 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <!-- Shield / Folder Icon -->
  <path d="M 70 50 L 130 50 L 130 85 C 130 95, 100 105, 100 105 C 100 105, 70 95, 70 85 Z" fill="none" stroke="#333" stroke-width="2" />
  
  <!-- Lock Mechanism -->
  <path d="M 90 40 C 90 25, 110 25, 110 40" fill="none" stroke="#FFF" stroke-width="2" class="lock-shackle" />
  <rect x="92" y="40" width="16" height="12" fill="#FFF" />

  <!-- Moving Data Packets -->
  <g class="data-packet-1">
    <rect x="135" y="60" width="8" height="8" fill="#FFF" />
  </g>
  <g class="data-packet-2">
    <rect x="135" y="75" width="12" height="4" fill="#555" />
  </g>

  <!-- Typography -->
  <text x="190" y="55" class="text-main">REPOSITORIES</text>
  <text x="192" y="80" class="text-sub">ACCESS_GRANTED :: DECRYPTING</text>
</svg>
