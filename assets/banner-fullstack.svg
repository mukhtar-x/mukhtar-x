<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <style>
      @keyframes reveal { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scan { 0% { transform: translateX(-90px); opacity: 0; } 20% { opacity: 0.7; } 65% { opacity: 0.25; } 100% { transform: translateX(1040px); opacity: 0; } }
      .bg { fill: #000000; stroke: #333333; stroke-width: 1; }
      .title { font-family: 'Fira Code', -apple-system, monospace; font-size: 18px; font-weight: 700; fill: #ffffff; animation: reveal 0.8s ease-out both; }
      .sub { font-family: 'Fira Code', -apple-system, monospace; font-size: 11px; fill: #a0a0a0; letter-spacing: 2px; animation: reveal 1s ease-out 0.2s both; }
      .scan { fill: #ffffff; animation: scan 4s ease-in-out 0.4s infinite; }
      .hud { stroke: #ffffff; stroke-width: 1.5; fill: none; opacity: 0.6; }
      .icon { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Expanded background rectangle for 1200px width -->
  <rect class="bg" x="2" y="2" width="1196" height="76" rx="6" />

  <!-- Adjusted right corner HUD brackets for 1200px width -->
  <path class="hud" d="M 12 18 L 12 12 L 18 12 M 1182 12 L 1188 12 L 1188 18 M 12 62 L 12 68 L 18 68 M 1188 62 L 1188 68 L 1182 68" />

  <g transform="translate(32, 28)">
    <circle class="icon" cx="12" cy="12" r="10"/>
    <path class="icon" d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20 M2 12h20"/>
  </g>

  <text x="70" y="38" class="title">Full-Stack Web Applications</text>
  <text x="70" y="58" class="sub">ENTERPRISE PORTALS · REACT &amp; NEXT.JS · DISTRIBUTED ARCHITECTURE</text>
  <rect x="70" y="67" width="120" height="2" rx="1" class="scan" />
</svg>
